<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMRW Crew Media Gallery</title>
  <meta name="description" content="TMRW Crew media gallery featuring videos and photos from performances and projects.">
  <link rel="canonical" href="https://tmrwcrew.com/Portfolio.html">
  <link rel="stylesheet" href="tmrw.css">
  <script src="tmrw.js" defer></script>
  <script src="events.js" defer></script>
  <script src="media.js" defer></script>
  <script src="portfolio.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to media content</a>

   <header class="header">
        <img src="tmrw crew/TMRW crew text.png" alt="TMRW Crew Logo" class="responsive-logo">
    </header>
  
    <nav class="nav" style="margin-top: 1.5rem;">
      <a href="index.html">About</a>
      <a href="team.html">Team</a>
      <a href="News.html">News</a>
      <a href="Portfolio.html" class="active">Media</a>
      <a href="archive.html">Archive</a>
      <a href="contacts.html">Contact</a>
    </nav>
  

  <main id="main-content" class="media-gallery portfolio-page">
    <h1 class="section-title">Media Gallery</h1>
    <div class="media-filters">
      <label for="media-category">Category</label>
      <select id="media-category" disabled>
        <option value="all">All categories</option>
        <option value="performance">Performances</option>
        <option value="battle">Battles</option>
        <option value="workshop">Workshops</option>
      </select>
      <label for="media-format">Format</label>
      <select id="media-format" disabled>
        <option value="all">All formats</option>
        <option value="photo">Photography</option>
        <option value="google-drive">Google Drive videos</option>
        <option value="youtube">YouTube videos</option>
        <option value="instagram">Instagram videos</option>
      </select>
    </div>
    <p id="media-status" role="status">Loading media…</p>
    <noscript><p>Enable JavaScript to browse media. <a href="https://www.instagram.com/tmrwcrew2020/">Visit TMRW Crew on Instagram</a>.</p></noscript>
    <div id="media-sections"></div>
    <section id="archived-events" aria-labelledby="archived-events-heading">
      <h2 id="archived-events-heading" class="section-title">Archived Events</h2>
      <p id="media-archive-status" role="status">Loading archived events…</p>
      <div id="media-archive" class="media-grid"></div>
      <p><a href="archive.html">Explore the event archive</a></p>
    </section>
    <dialog id="videoModal" class="media-dialog" aria-labelledby="video-title">
      <div class="media-dialog-header">
        <h2 id="video-title">Video</h2>
        <form method="dialog"><button type="submit" aria-label="Close video">Close ×</button></form>
      </div>
      <div id="video-player"></div>
    </dialog>
  </main>

   <footer class="footer" id="contact">
        <p>Connect with us</p>
        <div class="social-links">
            <a href="https://www.instagram.com/tmrwcrew2020/" target="_blank" class="social-icon" aria-label="TMRW Crew Instagram">
                <img src="tmrw crew/instagram logo.png" alt="Instagram" style="width:100px; height:100px;" />
            </a>    </div>
        <p>© 2020 TMRW Crew. Celebrating Diversity Through Movement.</p>
    </footer>

    <!-- Back to Top Button -->
    <button id="backToTopBtn" onclick="scrollToTop()" title="Back to top">↑</button>
</body>
</html>
